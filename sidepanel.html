<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Ghost Job Detector</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body class="side-panel">
  <div class="app">
    <header class="app__header">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16">
            <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.45"/>
            <circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.8"/>
            <circle cx="12" cy="12" r="1.6" fill="currentColor"/>
          </svg>
        </span>
        <span class="brand__name">Ghost Job Detector</span>
      </div>
      <div class="header-actions">
        <button id="expandBtn" class="icon-btn" title="Side panel open" aria-label="Side panel open" aria-pressed="true" type="button">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
            <path fill="currentColor" d="M7 4H4v3h2V6h1V4Zm13 0h-3v2h1v1h2V4ZM6 17H4v3h3v-2H6v-1Zm14 0h-2v1h-1v2h3v-3Z"/>
          </svg>
        </button>
      </div>
    </header>

    <section id="emptyState" class="state hidden">
      <p class="state__title">Open a LinkedIn job search</p>
      <p class="state__body">Select a job result on linkedin.com/jobs and leave this panel open to follow selections.</p>
    </section>

    <section id="loadingState" class="state hidden">
      <div class="scan-line"></div>
      <p class="state__body">Scanning posting…</p>
    </section>

    <section id="resultState" class="hidden">
      <div class="job-id">
        <p id="jobTitle" class="job-id__title">—</p>
        <p id="jobCompany" class="job-id__company">—</p>
      </div>
      <div class="score-row">
        <div class="dial" id="dial"><span id="scoreNumber" class="dial__number">0</span><span class="dial__max">/100</span></div>
        <div class="score-copy"><p id="scoreLevel" class="score-copy__level">Low risk</p><p id="scoreSummary" class="score-copy__summary">Heuristic ghost-job risk score</p></div>
      </div>
      <div class="stat-strip">
        <div class="stat"><span id="statAge" class="stat__value">—</span><span class="stat__label">days live</span></div>
        <div class="stat"><span id="statApplicants" class="stat__value">—</span><span class="stat__label">applicants</span></div>
        <div class="stat"><span id="statSalary" class="stat__value">—</span><span class="stat__label">salary listed</span></div>
      </div>
      <div id="flagList" class="flag-list"></div>
      <button id="rescanBtn" class="rescan-link" type="button">Refresh selected job</button>
    </section>
  </div>
  <script src="scorer.js"></script>
  <script src="popup.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
